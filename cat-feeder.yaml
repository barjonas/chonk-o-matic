substitutions:
  devicename: "cat-feeder"
  devicename_friendly: "Cat Feeder"
  dns_domain: !secret dns_domain
  api_key: !secret esphome_api_key
  
  # Hardware Pins (QT Pi ESP32 S2)
  servo_pin: A1
  sensor_pin: A2  # Must use ADC1 pin (A2 or A3) - ADC2 pins don't work with WiFi active
  
  # Tuning
  sensor_threshold_meters: "0.15"  # Proximity distance to trigger feed (in meters)
  door_open_duration: "1s"
  daily_counter_reset_time: "06:00" # Resets counters at 6 AM (or 6 hours after boot if offline)
  min_dispense_delay_scheduled: "1000" # Minimum milliseconds between scheduled dispenses (hold until presence OFF)
  min_dispense_delay_presence: "30000" # Minimum milliseconds between presence-triggered dispenses (hold until presence ON)
  
  # Servo Tuning (adjust these to calibrate servo without rebuilding)
  servo_min_level: "3%"    # Pulse width for 0° (closed position)
  servo_max_level: "12%"   # Pulse width for 180° (fully open)
  servo_idle_level: "3%"   # Position when idle (typically closed)
  servo_dispense_level: "50%"  # Position for dispensing (0-100%, where 50% ≈ 90°)
  servo_rollback_level: "1%"  # Anti-jam position (slightly before idle to release tension)
  servo_rollback_interval: "300ms"  # Hold time at rollback position

esp32:
  board: adafruit_qtpy_esp32s2
  framework:
    type: arduino
  
packages:
  feeder_logic:
    url: https://github.com/barjonas/chonk-o-matic
    ref: main
    files:
      - chonk-o-matic.yaml

# Required for the package's lambdas to use ArduinoJson.
# platformio_options cannot live inside a remote package, so it must be here.
# build_flags (not build_src_flags) is needed for ESPHome to apply this correctly.
platformio_options:
  build_flags: "-include ArduinoJson.h"

wifi:
  ssid: !secret admin_wifi_ssid
  password: !secret admin_wifi_password
  use_address: "${devicename}.${dns_domain}"

  ap:
    ssid: "${devicename_friendly} Fallback"
    password: !secret fallback_ap_password